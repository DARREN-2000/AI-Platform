apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentic-toolkit
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  # secret.example.yaml is intentionally excluded. Copy it to secret.yaml,
  # fill in keys, and add "- secret.yaml" here when using a real provider.
images:
  - name: agentic-ai-toolkit
    newTag: latest
