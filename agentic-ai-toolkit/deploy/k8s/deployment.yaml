apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-toolkit
  namespace: agentic-toolkit
  labels:
    app: agentic-toolkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-toolkit
  template:
    metadata:
      labels:
        app: agentic-toolkit
    spec:
      containers:
        - name: api
          image: agentic-ai-toolkit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentic-toolkit-config
            - secretRef:
                name: agentic-toolkit-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
