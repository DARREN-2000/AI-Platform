# Copy to secret.yaml, fill in real values, and add it to kustomization.yaml
# resources. The Deployment references it with optional: true, so the offline
# "rules" provider works without it.
apiVersion: v1
kind: Secret
metadata:
  name: agentic-toolkit-secrets
  namespace: agentic-toolkit
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  ANTHROPIC_API_KEY: "replace-me"
