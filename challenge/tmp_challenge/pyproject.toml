[project]
name = "synera-eval-takehome"
version = "0.1.0"
description = "Take-home: an evaluation harness for a small LangGraph agent."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# Pick what you actually use. None of these are required to complete the core task.
dev = ["pytest>=8"]
data = ["pandas>=2"]            # or polars, if you prefer
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synera_eval", "synera_eval.agent"]
