<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />

  <g transform="translate(400, 180)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="40" fill="url(#primary)" />
    <text x="0" y="5" font-family="sans-serif" font-size="14" fill="white" font-weight="bold" text-anchor="middle">Platform</text>

    <!-- Orbiting Nodes -->
    <g stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,5" fill="none">
      <circle cx="0" cy="0" r="120" />
    </g>

    <g fill="#1e293b" stroke="url(#primary)" stroke-width="2">
      <!-- IntentGraph -->
      <circle cx="0" cy="-120" r="24" />
      <text x="0" y="-115" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Agent</text>

      <!-- EnterpriseIQ -->
      <circle cx="114" cy="-37" r="24" />
      <text x="114" y="-32" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">RAG</text>

      <!-- GuardrailX -->
      <circle cx="70" cy="97" r="24" />
      <text x="70" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Sec</text>

      <!-- AI Hypervisor -->
      <circle cx="-70" cy="97" r="24" />
      <text x="-70" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">GPU</text>

      <!-- Inference -->
      <circle cx="-114" cy="-37" r="24" />
      <text x="-114" y="-32" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">LLM</text>
    </g>
  </g>

  <text x="400" y="340" font-family="sans-serif" font-size="28" fill="white" font-weight="bold" text-anchor="middle">Enterprise AI Platform</text>
  <text x="400" y="370" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Orchestrate. Govern. Scale.</text>
</svg>
