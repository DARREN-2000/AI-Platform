<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-arch)" rx="16" />

  <g font-family="sans-serif">
    <!-- Title -->
    <text x="400" y="40" font-size="24" fill="white" font-weight="bold" text-anchor="middle">Architecture Overview (V2)</text>

    <!-- Layers -->
    <g transform="translate(100, 80)">
      <!-- IntentGraph -->
      <rect x="0" y="0" width="600" height="60" rx="8" fill="url(#box-grad)" stroke="#3b82f6" stroke-width="2" />
      <text x="300" y="35" font-size="18" fill="white" font-weight="bold" text-anchor="middle">IntentGraph (Orchestration)</text>

      <!-- Connections -->
      <line x1="200" y1="60" x2="200" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="400" y1="60" x2="400" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Layer 2 -->
      <rect x="0" y="120" width="280" height="60" rx="8" fill="url(#box-grad)" stroke="#10b981" stroke-width="2" />
      <text x="140" y="155" font-size="18" fill="white" font-weight="bold" text-anchor="middle">EnterpriseIQ (RAG)</text>

      <rect x="320" y="120" width="280" height="60" rx="8" fill="url(#box-grad)" stroke="#8b5cf6" stroke-width="2" />
      <text x="460" y="155" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Inference Control Plane</text>

      <!-- Connections -->
      <line x1="460" y1="180" x2="460" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Layer 3 -->
      <rect x="320" y="240" width="280" height="60" rx="8" fill="url(#box-grad)" stroke="#ef4444" stroke-width="2" />
      <text x="460" y="275" font-size="18" fill="white" font-weight="bold" text-anchor="middle">GuardrailX (Governance)</text>

      <!-- Connections -->
      <line x1="460" y1="300" x2="460" y2="360" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)" />

      <!-- Layer 4 -->
      <rect x="0" y="360" width="600" height="60" rx="8" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="2" />
      <text x="300" y="395" font-size="18" fill="white" font-weight="bold" text-anchor="middle">AI Hypervisor Platform (GPU Virtualization)</text>
    </g>
  </g>
</svg>
