[project]
name = "llm-eval-starter"
version = "0.1.0"
description = "A lean, adaptable LLM-as-judge evaluation harness with CI regression gating."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
