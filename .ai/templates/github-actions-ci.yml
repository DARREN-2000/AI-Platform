# Copy to .github/workflows/ci.yml in the target project (do not run from .ai/templates).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest -q -m "not integration"
      - name: Eval gate
        run: python .ai/templates/eval_gate.py --dataset data/golden --threshold 0.8
